# Curated exercise catalog (plan 0.3 / audit §2.6 "the catalog serves the rank system").
#
# ~90 hand-picked movements, not the full 800+ dataset. Structure:
#   - 9 anchors (trust: real) — either a loaded lift with a real external-standard table
#     (back-squat, bench-press, deadlift, overhead-press, barbell-row: OpenPowerlifting-derived,
#     see packages/shared/src/rank/defaultStandards.ts ANCHOR_STANDARDS) or a bodyweight
#     movement with a real published rep-norm table (pushup, pullup, chinup, dip: REP_STANDARDS).
#     Anchors omit `anchor`/`ratio` entirely.
#   - Everything else declares `anchor` (must be one of the 9 anchor slugs above) + `ratio`,
#     the load (or rep-count) multiplier applied to the anchor's threshold table
#     (audit §7's synthetic-standard method). `trust: derived` for close variants of the
#     anchor movement, `trust: synthetic` for the isolation long tail.
#
# primaryMuscles/secondaryMuscles use wger's 15-muscle taxonomy (Anterior deltoid, Biceps
# brachii, Biceps femoris, Brachialis, Gastrocnemius, Gluteus maximus, Latissimus dorsi,
# Obliquus externus abdominis, Pectoralis major, Quadriceps femoris, Rectus abdominis,
# Serratus anterior, Soleus, Trapezius, Triceps brachii — see packages/ingest/src/muscles.ts
# for the slug list), matching the muscle-map SVG assets mirrored from wger. Deliberately
# adopted wholesale rather than approximated: earlier revisions had 17 looser tags (forearms,
# lower-back, side-delts, rear-delts, upper-back) that no highlight shape exists for; those
# were dropped or consolidated (upper-back -> traps) when the muscle map was rebuilt on real
# anatomical assets. wrist-curl/reverse-wrist-curl now have no primaryMuscles as a result (no
# forearm shape exists in the 15-muscle set) — known, accepted gap, not a bug.
#
# freeExerciseDbId: hand-verified against free-exercise-db's dist/exercises.json (fuzzy-matched
# then manually checked, per plan 0.3's "hand-verify the join" requirement — auto-accepting the
# top fuzzy-match score would have produced wrong photos for several exercises, e.g. reverse-fly
# nearly matched to "Reverse Crunch").
#
# Correction (audit/missing-photo-sourcing-research.md, 2026-09-04/05): the "12 exercises left
# with no id on purpose: no matching open-licensed photo exists for them" claim that used to be
# here was overstated for 10 of those 12 — see the research doc for the full per-exercise
# breakdown. 8 had exact free-exercise-db matches that were simply missed in the original
# hand-curation pass (glute-bridge, side-plank, hip-abduction-machine, machine-chest-press,
# pec-deck, neutral-grip-pullup, chest-supported-row, diamond-pushup — now filled in below).
# 2 more (single-leg-rdl, pike-pushup) have no free-exercise-db photo but do have a wger
# CC-BY-SA 4.0 one, sourced via the new `wgerImageId` field (see ingestImages.ts) instead.
# Only `goblet-lunge` remains genuinely unsourceable (no goblet lunge in any of the free
# open-licensed sets checked) and `landmine-press` has no photo anywhere, only a CC BY-SA
# illustration — both keep the softened ExerciseThumb.vue placeholder.
#
# wgerId: populated via packages/ingest/src/matchWgerIds.ts (exact English-name lookup, falling
# back to token-overlap fuzzy scoring against wger's full exercise-translation list; re-run it
# after adding a new curated entry). Same "auto-accept high confidence, hand-check the rest"
# process as freeExerciseDbId above — a few of the script's own top fuzzy guesses were still
# wrong (e.g. "Barbell Curl" nearly landed on "Barbell Wrist Curl", a different exercise) and got
# manually corrected or left unset rather than trusted blindly. 21 exercises are left with no
# wgerId: some have no good wger equivalent at all (e.g. dumbbell-bench-press — wger only has
# decline/incline/close-grip dumbbell bench press variants, not the plain flat one), others just
# scored below the auto-accept threshold and weren't worth hand-verifying one at a time. Every
# entry without a wgerId falls back to @liftr/shared's rule-based deriveRequirements() for its
# requiredEquipment tiers instead of wger's real per-exercise tags — see ingestCatalog.ts.
#
# ratios are starting estimates, not measured — audit §7 explicitly leaves this open and
# expects tuning. They are data, not code: adjust here and re-run `pnpm ingest --standards`.

