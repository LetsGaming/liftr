services:
  liftr:
    build: .
    image: liftr:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Fixed regardless of anything in .env (`environment:` overrides `env_file:` for the same
      # key in Compose) — the app must always listen on the same container-internal port the
      # healthcheck and the port mapping below both hardcode to 3001. LIFTR_HOST_PORT below is
      # the only thing a custom host port should ever change.
      PORT: "3001"
    ports:
      - "${LIFTR_HOST_PORT:-3001}:3001"
    volumes:
      - liftr-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  liftr-data:
