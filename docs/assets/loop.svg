<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="The core loop: log a set, rank moves, recover and repeat">
  <defs>
    <linearGradient id="loopbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#0e0d20"/>
    </linearGradient>
    <radialGradient id="loopwash" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="rgba(138,109,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(138,109,255,0)"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="rgba(255,255,255,0.20)"/>
    </marker>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#loopbg)"/>
  <rect width="1200" height="260" rx="20" fill="url(#loopwash)"/>

  <g font-family="'Hanken Grotesk',system-ui,sans-serif">
    <!-- step 1 -->
    <g transform="translate(60,50)">
      <rect width="320" height="160" rx="16" fill="#161c2d" stroke="rgba(255,255,255,0.20)"/>
      <circle cx="46" cy="46" r="22" fill="rgba(47,159,224,0.15)"/>
      <path transform="translate(35,35)" d="M4 12l5 5 11-13" stroke="#2f9fe0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="40" font-size="13" fill="#2f9fe0" letter-spacing="1">STEP 1</text>
      <text x="80" y="64" font-weight="700" font-size="19" fill="#eef2fb">Log it in 1-2 taps</text>
      <text x="30" y="120" font-size="13" fill="#98a2c0">Last time's weight &amp; reps sit</text>
      <text x="30" y="140" font-size="13" fill="#98a2c0">right next to the input.</text>
    </g>

    <!-- arrow 1 -->
    <path d="M394 130 h50" stroke="rgba(255,255,255,0.20)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- step 2 -->
    <g transform="translate(460,50)">
      <rect width="320" height="160" rx="16" fill="#161c2d" stroke="rgba(255,255,255,0.20)"/>
      <circle cx="46" cy="46" r="22" fill="rgba(138,109,255,0.15)"/>
      <path transform="translate(33,33) scale(1.1)" d="M12 2a4.5 4.5 0 110 9 4.5 4.5 0 010-9zM9.3 10.5L6 21l6-3.2 6 3.2-3.3-10.5" fill="#8a6dff"/>
      <text x="80" y="40" font-size="13" fill="#8a6dff" letter-spacing="1">STEP 2</text>
      <text x="80" y="64" font-weight="700" font-size="19" fill="#eef2fb">Your rank moves</text>
      <text x="30" y="120" font-size="13" fill="#98a2c0">Live feedback, no loading —</text>
      <text x="30" y="140" font-size="13" fill="#98a2c0">progress feels real instantly.</text>
    </g>

    <!-- arrow 2 -->
    <path d="M794 130 h50" stroke="rgba(255,255,255,0.20)" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- step 3 -->
    <g transform="translate(860,50)">
      <rect width="320" height="160" rx="16" fill="#161c2d" stroke="rgba(255,255,255,0.20)"/>
      <circle cx="46" cy="46" r="22" fill="rgba(214,58,255,0.15)"/>
      <path transform="translate(33,32) scale(1.05)" d="M12 21s-7-4.35-9.5-8.8C.6 8.3 2.7 4.5 6.4 4.5c2 0 3.4 1.1 4.1 2.3.7-1.2 2.1-2.3 4.1-2.3 3.7 0 5.8 3.8 3.9 7.7C19 16.65 12 21 12 21z" fill="#d63aff"/>
      <text x="80" y="40" font-size="13" fill="#d63aff" letter-spacing="1">STEP 3</text>
      <text x="80" y="64" font-weight="700" font-size="19" fill="#eef2fb">Recover &amp; repeat</text>
      <text x="30" y="120" font-size="13" fill="#98a2c0">The Recovery Zone tells you honestly</text>
      <text x="30" y="140" font-size="13" fill="#98a2c0">if today's a green light or a rest day.</text>
    </g>
  </g>
</svg>
