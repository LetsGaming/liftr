<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Liftr — log a set, watch your rank move">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#0e0d20"/>
    </linearGradient>
    <radialGradient id="wash" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(138,109,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(138,109,255,0)"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f9fe0"/>
      <stop offset="55%" stop-color="#8a6dff"/>
      <stop offset="100%" stop-color="#d63aff"/>
    </linearGradient>
    <linearGradient id="nebula" gradientUnits="userSpaceOnUse" x1="93" y1="389" x2="420" y2="123">
      <stop offset="0%" stop-color="#2f9fe0"/>
      <stop offset="55%" stop-color="#8a6dff"/>
      <stop offset="100%" stop-color="#d63aff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fb4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#wash)"/>

  <!-- mark: Stride-L, same geometry as packages/client/public/icons/icon-master.svg -->
  <g transform="translate(34,20.6) scale(0.28)">
    <path d="M 120 150 L 120 362 L 216 362 L 320 258" fill="none" stroke="url(#nebula)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="386" cy="192" r="34" fill="url(#nebula)"/>
  </g>

  <!-- wordmark -->
  <text x="170" y="140" font-family="'Unbounded',system-ui,sans-serif" font-weight="800" font-size="86" letter-spacing="4" fill="url(#wordmark)">LIFTR</text>
  <text x="174" y="182" font-family="'Hanken Grotesk',system-ui,sans-serif" font-weight="400" font-size="22" fill="#9aa4bf">log a set. watch your rank move.</text>

  <!-- tier ladder: the real 9-tier ladder (Initiate -> Apex), growing left to right. Icon paths
       match packages/client/src/lib/tierIcons.ts's TIER_BADGE_PATH exactly, so this stays the
       same badge a rank-up actually shows in the app. No per-badge labels here (9 names in this
       width gets cramped) — the README's own ladder table spells out what each tier means. -->
  <g>
    <!-- initiate -->
    <g transform="translate(60,245)">
      <circle cx="14" cy="14" r="14" fill="#1a1a1a"/>
      <path transform="translate(7.8,7.8) scale(0.52)" d="M12 9a3 3 0 110 6 3 3 0 010-6z" fill="#9a9a9a"/>
    </g>
    <!-- apprentice -->
    <g transform="translate(119,239)">
      <circle cx="17" cy="17" r="17" fill="#3a2109"/>
      <path transform="translate(9.4,9.4) scale(0.63)" d="M12 3l2 4 4 .5-3 3 .8 4L12 16l-3.8 2.5.8-4-3-3 4-.5z" fill="#e08a3c"/>
    </g>
    <!-- trainee -->
    <g transform="translate(170,233)">
      <circle cx="20" cy="20" r="20" fill="#2a2508"/>
      <path transform="translate(11.1,11.1) scale(0.74)" d="M12 4l7 6-1.4 1.4L12 6.8 6.4 11.4 5 10zM12 12l7 6-1.4 1.4L12 14.8l-5.6 4.6L5 18z" fill="#c9b23e"/>
    </g>
    <!-- athlete -->
    <g transform="translate(227,227)">
      <circle cx="23" cy="23" r="23" fill="#232a38"/>
      <path transform="translate(12.8,12.8) scale(0.85)" d="M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5z" fill="#c7d1e4"/>
    </g>
    <!-- lifter -->
    <g transform="translate(290,221)">
      <circle cx="26" cy="26" r="26" fill="#0f2e1f"/>
      <path transform="translate(14.4,14.4) scale(0.96)" d="M4 20c0-6 3-9 8-9M4 20h4M8 4c4 0 6 3 6 6 0 2-1 3-2 4l4 6-3 1-4-6" fill="none" stroke="#5fd6a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- advanced -->
    <g transform="translate(359,215)">
      <circle cx="29" cy="29" r="29" fill="#3a2a04"/>
      <path transform="translate(16.1,16.1) scale(1.07)" d="M12 2a4.5 4.5 0 110 9 4.5 4.5 0 010-9zM9.3 10.5L6 21l6-3.2 6 3.2-3.3-10.5" fill="#ffd24a"/>
    </g>
    <!-- elite -->
    <g transform="translate(435,207)">
      <circle cx="33" cy="33" r="33" fill="#2a0f2e"/>
      <path transform="translate(18.3,18.3) scale(1.22)" d="M12 2 3 9l9 13 9-13z" fill="#c8a0cc"/>
    </g>
    <!-- expert -->
    <g transform="translate(519,199)">
      <circle cx="37" cy="37" r="37" fill="#0d2b2c"/>
      <path transform="translate(20.6,20.6) scale(1.37)" d="M12 4c-3 2-4 6-3 10M12 4c3 2 4 6 3 10M12 4v14" fill="none" stroke="#96c0ba" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- apex -->
    <g transform="translate(612,189)">
      <circle cx="42" cy="42" r="66" fill="url(#glow)"/>
      <circle cx="42" cy="42" r="42" fill="#152449"/>
      <path transform="translate(23.3,23.3) scale(1.56)" d="M4 18h16l-1.2-8.5-3.8 3.8-3-6.3-3 6.3-3.8-3.8z" fill="#8fb4ff"/>
    </g>
  </g>

  <!-- overall-rank stat tile, right side -->
  <g transform="translate(880,64)">
    <rect width="260" height="150" rx="16" fill="#161c2d" stroke="rgba(255,255,255,0.20)"/>
    <text x="22" y="36" font-size="13" fill="#98a2c0" letter-spacing="1">OVERALL RANK</text>
    <text x="22" y="86" font-family="'Unbounded',system-ui,sans-serif" font-weight="800" font-size="32" fill="#ffd24a">ADVANCED II</text>
    <text x="22" y="118" font-size="13" fill="#98a2c0">Personal best: Elite I</text>
    <rect x="22" y="130" width="216" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
    <rect x="22" y="130" width="146" height="6" rx="3" fill="#ffd24a"/>
  </g>
</svg>
