<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Nebula F2: matches --nebula-sweep-base-1/--bg's dark-mode value (tokens.css) — the
         pre-JS placeholder before themeStore.applyTheme() takes over and keeps this meta in
         sync with the live theme via getComputedStyle(document.documentElement) on --bg. -->
    <meta name="theme-color" content="#0a0c14" />
    <title>Liftr</title>
    <!-- Full icon set (feedback: no favicon shipped) — favicon.svg for modern browsers, the
         classic PNG fallback pair for anything that only understands raster favicons, and
         apple-touch-icon for iOS home-screen/bookmark. PWA install icons are declared in the
         manifest (vite.config.ts), not here. -->
    <link rel="icon" href="/icons/icon-master.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
