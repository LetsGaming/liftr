attributionsPage:
  title: "Sources & Licenses"
  intro: "Liftr imports reference data once (not on every request) from the following sources. One exception: route calculation for planned routes queries OpenRouteService live per request, not once."
  wger:
    name: "wger Exercise Database"
    desc: "Exercise catalog, muscle group tags"
    license: "CC-BY-SA"
    credit: "github.com/wger-project/wger"
  wgerPhotos:
    name: "wger Exercise Database"
    desc: "Exercise photos for 2 exercises with no free free-exercise-db shot (\"Single-Leg RDL\", \"Pike Push-Up\")"
    license: "CC-BY-SA 4.0"
    credit: "wger.de/media/exercise-images · Authors: Tierrasverdes (Single-Leg RDL), Nash (Pike Push-Up). wger flags the Pike Push-Up photo as AI-generated (\"is_ai_generated\") — kept deliberately, since no other freely licensed photo of this exercise exists."
  muscleDiagram:
    name: "Muscle Diagram (Anatomy Figure)"
    desc: "Body outline + 15 individually highlighted muscles, mirrored from wger's assets, originally derived from \"Muscular system.svg\"/\"Muscular system-back.svg\" by Termininja"
    license: "CC-BY-SA 3.0"
    credit: "commons.wikimedia.org · via github.com/wger-project/wger · recolored in-house for the dark theme"
  freeExerciseDb:
    name: "free-exercise-db (yuhonas)"
    desc: "Start/end position images"
    license: "Unlicense (public domain)"
    credit: "github.com/yuhonas/free-exercise-db"
  openPowerlifting:
    name: "OpenPowerlifting"
    desc: "Strength standards (squat/bench press/deadlift)"
    license: "CC0 (public domain)"
    credit: "openpowerlifting.org"
  openStreetMap:
