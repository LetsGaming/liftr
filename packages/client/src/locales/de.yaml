    credit: "wger.de/media/exercise-images · Autoren: Tierrasverdes (Einbeiniges RDL), Nash (Pike-Liegestütze). Das Pike-Liegestütze-Foto ist laut wger als KI-generiert gekennzeichnet (\"is_ai_generated\") — bewusst übernommen, da keine andere frei lizenzierte Aufnahme dieser Übung existiert."
