    name: "Muskel-Diagramm (Anatomie-Figur)"
    desc: "Körperumriss + 15 einzeln hervorgehobene Muskeln, mirror von wger's Assets, ursprünglich abgeleitet von \"Muscular system.svg\"/\"Muscular system-back.svg\" von Termininja"
