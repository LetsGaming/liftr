name: Release

# Tag-triggered: push a `v1.2.3`-style tag to cut a release. `workflow_dispatch` lets you run the
# whole pipeline by hand first (e.g. to check the APK build/signing works) without cutting a real
# tag — that run builds and uploads the APK as a workflow artifact but does NOT create a GitHub
# Release (no tag to attach it to).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # only actually needed by the create-release job (uploading a release asset)
  checks: read # only needed by check-ci, to look up whether this commit already passed CI

jobs:
  # Tagging a commit that was JUST pushed to main (the normal `bump-version.mjs --push` flow)
  # means ci.yml's own `push` trigger already ran the full suite for this exact SHA seconds
  # earlier — re-running it via the `test` job below would just be paying for the same
  # typecheck/lint/test/build/smoke-test twice. This looks up whether a "check" check-run
  # already succeeded for `github.sha` and skips the redundant re-run when it did; anything not
  # already covered (a manually-created tag, workflow_dispatch off a branch with no prior CI
  # run) still gets tested for real below.
  check-ci:
    runs-on: ubuntu-latest
    outputs:
      already-passed: ${{ steps.check.outputs.already-passed }}
    steps:
      - name: Check for an existing successful CI run on this exact commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success")] | length')
          if [[ "$count" -gt 0 ]]; then
            echo "already-passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-passed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check-ci
    if: needs.check-ci.outputs.already-passed != 'true'
    uses: ./.github/workflows/ci.yml

  build-apk:
    needs: [check-ci, test]
    # `test` is legitimately skipped (not failed) when check-ci found this commit already green —
    # `needs.test.result` is 'skipped' in that case, not 'success', so it has to be allowed here too.
    if: |
      always() &&
      needs.check-ci.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # see ci.yml's matching comment: pnpm's own CLI needs Node >=22.13 to run at all.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # matches AGP 8.13 / compileSdk 36's requirements (packages/client/android)

      - name: Ensure required Android SDK platform/build-tools are installed
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Derive app version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build shared package (client build needs its dist)
        run: pnpm --filter @liftr/shared build

      - name: Build client web assets
        run: pnpm --filter @liftr/client build

      - name: Sync web assets into the Android project
        working-directory: packages/client
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — building an UNSIGNED apk. See docs/operations/android-release-signing.md to set up release signing."
          else
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          fi

      - name: Build signed release APK
        working-directory: packages/client/android
        env:
          LIFTR_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 && format('{0}/release.keystore', runner.temp) || '' }}
          LIFTR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFTR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFTR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Locate built APK
        id: apk
        run: |
          apk=$(find packages/client/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [[ -z "$apk" ]]; then
            echo "::error::No APK found under app/build/outputs/apk/release"
            exit 1
          fi
          # Gradle's own output name (app-release.apk, from its default archivesBaseName) — rename
          # the actual file, not just the upload-artifact/release label below, which name the
          # artifact zip / GitHub-UI display string but never touch the file inside.
          renamed="$(dirname "$apk")/liftr-${{ steps.version.outputs.name }}.apk"
          mv "$apk" "$renamed"
          echo "path=$renamed" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: liftr-${{ steps.version.outputs.name }}.apk
          path: ${{ steps.apk.outputs.path }}

      - name: Extract this version's changelog section
        if: github.ref_type == 'tag'
        run: |
          version="${{ steps.version.outputs.name }}"
          if ! node scripts/changelog-section.mjs "$version" > "${RUNNER_TEMP}/release-notes.md" 2>/dev/null; then
            echo "No CHANGELOG.md section found for $version — falling back to generic notes." > "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Attach APK to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body_path: ${{ runner.temp }}/release-notes.md
