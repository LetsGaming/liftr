name: Release

# Tag-triggered: push a `v1.2.3`-style tag to cut a release. `workflow_dispatch` lets you run the
# whole pipeline by hand first (e.g. to check the APK build/signing works) without cutting a real
# tag — that run builds and uploads the APK as a workflow artifact but does NOT create a GitHub
# Release (no tag to attach it to).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # only actually needed by the create-release job (uploading a release asset)

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # see ci.yml's matching comment: pnpm's own CLI needs Node >=22.13 to run at all.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # matches AGP 8.13 / compileSdk 36's requirements (packages/client/android)

      - name: Ensure required Android SDK platform/build-tools are installed
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Derive app version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build client web assets
        run: pnpm --filter @liftr/client build

      - name: Sync web assets into the Android project
        working-directory: packages/client
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — building an UNSIGNED apk. See docs/operations/android-release-signing.md to set up release signing."
          else
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          fi

      - name: Build signed release APK
        working-directory: packages/client/android
        env:
          LIFTR_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 && format('{0}/release.keystore', runner.temp) || '' }}
          LIFTR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFTR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFTR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Locate built APK
        id: apk
        run: |
          apk=$(find packages/client/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [[ -z "$apk" ]]; then
            echo "::error::No APK found under app/build/outputs/apk/release"
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: liftr-${{ steps.version.outputs.name }}.apk
          path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
