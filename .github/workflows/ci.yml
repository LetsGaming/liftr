name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call: # lets release.yml reuse this as its test gate before building the APK

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          # pnpm's own CLI (action below pins a floating v11.x) now requires Node >=22.13 just to
          # run `pnpm install` — this is about the tool, not the app itself (package.json's
          # "engines" still says >=20, which remains accurate for what Liftr needs at runtime).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm -r --filter=./packages/* build

      - name: Smoke-test the compiled server actually boots
        env:
          LIFTR_DB_PATH: ${{ runner.temp }}/ci-smoke.db
          PORT: "39999"
        run: |
          node packages/server/dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:39999/api/health >/dev/null; then
              echo "server booted and healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::compiled server did not become healthy within 10s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
