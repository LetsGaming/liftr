name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call: # lets release.yml reuse this as its test gate before building the APK

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # pnpm's own CLI (action below pins a floating v11.x) now requires Node >=22.13 just to
          # run `pnpm install` — this is about the tool, not the app itself (package.json's
          # "engines" still says >=20, which remains accurate for what Liftr needs at runtime).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
